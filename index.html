<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Interest Calculator</title>

</head>
<body>
    <center>
        <h1 style="color: blue;">Simple Interest Calculator</h1>
        <form action="/calculate" method="post">
            <input type = "number" step="any"name="p" id="principal" placeholder="Principal Amount" required>
            
            <input type="number" step="any"name="r" id="rate" placeholder="Rate of Interest" required><br><br>

            <input type="number"  step="any" name="t" id="time" placeholder="Time (in years)" required><br><br>

            <input type="submit" value="Calculate">
        </form>
    </center>

{# Display output if available #}
{% if result %}
    <hr>
    <h3>Result,</h3>
    <span>principal: {{ principal }}</span><br>
    <span>rate: {{ rate }}</span><br>
    <span>time: {{ time }}</span><br>
    <span>
        <b>Simple Interest - {{ result }}:</b> <br>
         <b>Total Amount - {{ total_amount }}:</b> <br>

    </span>
{% endif %}
    </body>
</html>
